[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmem"
version = "5.81.1"
description = "Persistent graph memory with adaptive retrieval and grounded prompts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Chen Han"},
  {name = "Gao Sen"},
  {name = "Pang Zixi"},
  {name = "He Bingsheng"},
  {name = "NUS Computing"},
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "openai>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-asyncio>=0.24"]
service = ["tokenizers>=0.20", "faiss-cpu>=1.8", "hnswlib>=0.8"]
dense = ["faiss-cpu>=1.8"]

[project.scripts]
graphmem = "graphmem.service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphmem*"]

[tool.setuptools.package-data]
"graphmem.service" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_default_fixture_loop_scope = "function"
